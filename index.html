<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gymlog</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymlog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>
<nav id="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="progress">Progress</button>
  <button data-act="tab" data-tab="history">History</button>
  <button data-act="tab" data-tab="plan">Plan</button>
</nav>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
